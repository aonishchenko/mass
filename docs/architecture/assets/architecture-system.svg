<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="900" viewBox="0 0 1840 900" role="img" aria-labelledby="title desc">
<title id="title">MASS system architecture</title>
<desc id="desc">How MASS runs: a browser client, an AI Sessions Engine built on Cloudflare Workers and Durable Objects, and four onchain layers — World for personhood, ENS for identity, 0G for inference and archive, Hedera for provenance and payouts.</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
    <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
  </marker>
  <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
    <path d="M2,2 L10,6 L2,10 Z" fill="#b45309"/>
  </marker>
  <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
    <path d="M2,2 L10,6 L2,10 Z" fill="#15803d"/>
  </marker>
  <filter id="softShadow" x="-12%" y="-12%" width="126%" height="132%">
    <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.10"/>
  </filter>
  <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#eef6ff"/><stop offset="1" stop-color="#f8fbff"/>
  </linearGradient>
  <linearGradient id="chainGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f6fdf9"/><stop offset="1" stop-color="#fbfefc"/>
  </linearGradient>
  <linearGradient id="clientGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fdf9f4"/><stop offset="1" stop-color="#fffdfa"/>
  </linearGradient>
</defs>
<style>
  .bg { fill: #f8fafc; }
  .title { font: 800 44px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
  .subtitle { font: 550 19px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
  .sectionName { font: 800 21px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; letter-spacing: .04em; }
  .sectionSub { font: 600 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; letter-spacing: .02em; }
  .smallLabel { font: 750 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
  .body { font: 500 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
  .tiny { font: 600 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
  .flowTag { font: 750 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
  .logoText { font: 800 20px Inter, ui-sans-serif, system-ui, sans-serif; fill: #fff; }
  .group { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; rx: 20; }
  .groupCore { fill: url(#coreGrad); stroke: #93c5fd; stroke-width: 2; rx: 22; }
  .groupChain { fill: url(#chainGrad); stroke: #86efac; stroke-width: 2; rx: 22; }
  .groupClient { fill: url(#clientGrad); stroke: #fcd9a8; stroke-width: 2; rx: 22; }
  .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 12; filter: url(#softShadow); }
  .plain { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 12; }
  .blueBox { fill: #dbeafe; stroke: #60a5fa; stroke-width: 1.4; rx: 12; }
  .amberBox { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1.4; rx: 12; }
  .chainBox { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 14; filter: url(#softShadow); }
  .tagBox { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; }
  .dashed { fill: #ffffff; fill-opacity: .55; stroke: #cbd5e1; stroke-width: 1.2; stroke-dasharray: 6 5; rx: 14; }
  .flow { fill: none; stroke: #475569; stroke-width: 2.2; }
  .flowAmber { fill: none; stroke: #b45309; stroke-width: 2.2; }
  .flowGreen { fill: none; stroke: #15803d; stroke-width: 2.2; }
</style>
<rect class="bg" x="0" y="0" width="1840" height="900"/>
<text x="56" y="66" text-anchor="start" class="title"><tspan x="56" dy="0">MASS — How It Works</tspan></text>
<text x="58" y="104" text-anchor="start" class="subtitle"><tspan x="58" dy="0">Verified humans build one agent together. Every contribution is signed, anchored, and owned — and the payout follows the same log.</tspan></text>
<rect class="groupClient" x="50" y="150" width="380" height="640"/>
<text x="76" y="184" text-anchor="start" class="sectionName"><tspan x="76" dy="0">BROWSER CLIENT</tspan></text>
<text x="76" y="206" text-anchor="start" class="sectionSub"><tspan x="76" dy="0">React</tspan></text>
<rect class="blueBox" x="78" y="230" width="324" height="116"/>
<text x="240.0" y="260" text-anchor="middle" class="smallLabel"><tspan x="240.0" dy="0">Session thread</tspan></text>
<text x="98" y="284" text-anchor="start" class="body"><tspan x="98" dy="0">Everyone talks to the same</tspan><tspan x="98" dy="20">agent, in one conversation.</tspan></text>
<rect class="blueBox" x="78" y="364" width="324" height="116"/>
<text x="240.0" y="394" text-anchor="middle" class="smallLabel"><tspan x="240.0" dy="0">Crew rail</tspan></text>
<text x="98" y="418" text-anchor="start" class="body"><tspan x="98" dy="0">Who is here, what tier they</tspan><tspan x="98" dy="20">hold, what just happened.</tspan></text>
<rect class="blueBox" x="78" y="498" width="324" height="116"/>
<text x="240.0" y="528" text-anchor="middle" class="smallLabel"><tspan x="240.0" dy="0">Review sheet</tspan></text>
<text x="98" y="552" text-anchor="start" class="body"><tspan x="98" dy="0">Where a contribution is</tspan><tspan x="98" dy="20">proposed and co-signed.</tspan></text>
<rect class="blueBox" x="78" y="632" width="324" height="116"/>
<text x="240.0" y="662" text-anchor="middle" class="smallLabel"><tspan x="240.0" dy="0">Live evidence</tspan></text>
<text x="98" y="686" text-anchor="start" class="body"><tspan x="98" dy="0">Ledger ticker, agent CV, cap</tspan><tspan x="98" dy="20">table — refreshing on their own.</tspan></text>
<rect class="groupCore" x="470" y="150" width="860" height="640"/>
<text x="496" y="184" text-anchor="start" class="sectionName"><tspan x="496" dy="0">AI SESSIONS ENGINE</tspan></text>
<text x="496" y="206" text-anchor="start" class="sectionSub"><tspan x="496" dy="0">Cloudflare Workers + Durable Objects</tspan></text>
<rect class="plain" x="496" y="230" width="390" height="118"/>
<text x="514" y="265" text-anchor="start" class="smallLabel"><tspan x="514" dy="0">CF Worker</tspan></text>
<text x="514" y="298" text-anchor="start" class="tiny"><tspan x="514" dy="0">Routes the API and the live socket, serves the</tspan><tspan x="514" dy="18">client, and hands each session to its own</tspan><tspan x="514" dy="18">single writer.</tspan></text>
<rect class="plain" x="910" y="230" width="390" height="118"/>
<circle cx="941.0" cy="259.0" r="13.0" fill="#111"/><circle cx="941.0" cy="259.0" r="7.8" fill="none" stroke="#fff" stroke-width="2.21"/><ellipse cx="941.0" cy="259.0" rx="3.38" ry="7.8" fill="none" stroke="#fff" stroke-width="2.21"/>
<g transform="translate(962,246) scale(1.08333)"><path d="M11.725.223 5.107 11.13a.146.146 0 0 1-.237.018c-.583-.692-2.753-3.64-.067-6.327 2.45-2.452 5.572-4.2 6.73-4.804.13-.068.269.08.192.206m-.366 23.747c.132.093.295-.064.206-.2-1.478-2.251-6.392-9.744-7.07-10.869-.67-1.11-1.987-2.953-2.097-4.53-.011-.158-.228-.19-.283-.042a10 10 0 0 0-.27.85c-1.105 4.11.5 8.472 3.985 10.916zm.909-.193 6.618-10.907a.146.146 0 0 1 .237-.018c.582.692 2.753 3.64.067 6.327-2.45 2.452-5.572 4.2-6.73 4.804-.13.068-.269-.08-.192-.206M12.641.028c-.132-.093-.295.065-.206.2 1.478 2.252 6.392 9.745 7.07 10.87.67 1.109 1.987 2.952 2.097 4.53.011.157.228.19.283.041.088-.239.182-.524.27-.85 1.105-4.11-.5-8.472-3.985-10.915z" fill="#0080BC"/></g>
<text x="996" y="265" text-anchor="start" class="smallLabel"><tspan x="996" dy="0">Auth</tspan></text>
<text x="928" y="298" text-anchor="start" class="tiny"><tspan x="928" dy="0">World proves a unique human. ENS gives every</tspan><tspan x="928" dy="18">seat a name that resolves outside our app.</tspan></text>
<rect class="plain" x="496" y="364" width="390" height="118"/>
<text x="514" y="399" text-anchor="start" class="smallLabel"><tspan x="514" dy="0">Session Room</tspan></text>
<text x="514" y="432" text-anchor="start" class="tiny"><tspan x="514" dy="0">One per session. An append-only event log —</tspan><tspan x="514" dy="18">every view of the session is a fold over it,</tspan><tspan x="514" dy="18">and nothing else may write.</tspan></text>
<rect class="plain" x="910" y="364" width="390" height="118"/>
<rect x="928" y="380" width="26" height="26" rx="6.8" fill="#111"/><text x="941.0" y="398.2" text-anchor="middle" class="logoText" style="font-size:12.0px">0G</text>
<text x="962" y="399" text-anchor="start" class="smallLabel"><tspan x="962" dy="0">LLM harness</tspan></text>
<text x="928" y="432" text-anchor="start" class="tiny"><tspan x="928" dy="0">Runs every answer on the 0G Router in a trusted</tspan><tspan x="928" dy="18">enclave, framed by what the crew has taught.</tspan></text>
<rect class="plain" x="496" y="498" width="390" height="118"/>
<text x="514" y="533" text-anchor="start" class="smallLabel"><tspan x="514" dy="0">Cap table</tspan></text>
<text x="514" y="566" text-anchor="start" class="tiny"><tspan x="514" dy="0">Ownership derived from accepted contributions.</tspan><tspan x="514" dy="18">Never hand-set — it is a fold over the log.</tspan></text>
<rect class="plain" x="910" y="498" width="390" height="118"/>
<rect x="928" y="514" width="26" height="26" rx="6.8" fill="#111"/><text x="941.0" y="532.2" text-anchor="middle" class="logoText" style="font-size:12.0px">0G</text>
<text x="962" y="533" text-anchor="start" class="smallLabel"><tspan x="962" dy="0">Attribution + storage</tspan></text>
<text x="928" y="566" text-anchor="start" class="tiny"><tspan x="928" dy="0">Measures which knowledge an answer actually</tspan><tspan x="928" dy="18">used, and archives the whole session to 0G.</tspan></text>
<rect class="plain" x="496" y="632" width="390" height="118"/>
<g transform="translate(514,648) scale(0.010400)"><path d="M1250,0C559.64,0,0,559.64,0,1250S559.64,2500,1250,2500s1250-559.64,1250-1250S1940.36,0,1250,0" fill="#222"/><path d="M1758.12,1790.62H1599.38V1453.13H900.62v337.49H741.87V696.25H900.62v329.37h698.76V696.25h158.75Zm-850-463.75h698.75V1152.5H908.12Z" fill="#fff"/></g>
<text x="548" y="667" text-anchor="start" class="smallLabel"><tspan x="548" dy="0">Ledger</tspan></text>
<text x="514" y="700" text-anchor="start" class="tiny"><tspan x="514" dy="0">Anchors a hash of each event to the public</tspan><tspan x="514" dy="18">ledger — hashes only, never the content.</tspan></text>
<rect class="plain" x="910" y="632" width="390" height="118"/>
<g transform="translate(928,648) scale(0.010400)"><path d="M1250,0C559.64,0,0,559.64,0,1250S559.64,2500,1250,2500s1250-559.64,1250-1250S1940.36,0,1250,0" fill="#222"/><path d="M1758.12,1790.62H1599.38V1453.13H900.62v337.49H741.87V696.25H900.62v329.37h698.76V696.25h158.75Zm-850-463.75h698.75V1152.5H908.12Z" fill="#fff"/></g>
<text x="962" y="667" text-anchor="start" class="smallLabel"><tspan x="962" dy="0">Payout engine</tspan></text>
<text x="928" y="700" text-anchor="start" class="tiny"><tspan x="928" dy="0">Splits a job 70% by what it used, 30% by who</tspan><tspan x="928" dy="18">owns it, in whole units that reconcile exactly.</tspan></text>
<rect class="groupChain" x="1370" y="150" width="420" height="640"/>
<text x="1396" y="184" text-anchor="start" class="sectionName"><tspan x="1396" dy="0">ONCHAIN</tspan></text>
<text x="1396" y="206" text-anchor="start" class="sectionSub"><tspan x="1396" dy="0">what the app cannot vouch for alone</tspan></text>
<rect class="chainBox" x="1396" y="230" width="368" height="118"/>
<circle cx="1427.0" cy="259.0" r="13.0" fill="#111"/><circle cx="1427.0" cy="259.0" r="7.8" fill="none" stroke="#fff" stroke-width="2.21"/><ellipse cx="1427.0" cy="259.0" rx="3.38" ry="7.8" fill="none" stroke="#fff" stroke-width="2.21"/>
<text x="1450" y="260" text-anchor="start" class="smallLabel"><tspan x="1450" dy="0">World</tspan></text>
<text x="1450" y="278" text-anchor="start" class="tiny"><tspan x="1450" dy="0">Proof of personhood</tspan></text>
<text x="1414" y="302" text-anchor="start" class="tiny"><tspan x="1414" dy="0">Proves a seat is a real, unique</tspan><tspan x="1414" dy="18">person.</tspan></text>
<rect class="chainBox" x="1396" y="364" width="368" height="118"/>
<g transform="translate(1414,380) scale(1.08333)"><path d="M11.725.223 5.107 11.13a.146.146 0 0 1-.237.018c-.583-.692-2.753-3.64-.067-6.327 2.45-2.452 5.572-4.2 6.73-4.804.13-.068.269.08.192.206m-.366 23.747c.132.093.295-.064.206-.2-1.478-2.251-6.392-9.744-7.07-10.869-.67-1.11-1.987-2.953-2.097-4.53-.011-.158-.228-.19-.283-.042a10 10 0 0 0-.27.85c-1.105 4.11.5 8.472 3.985 10.916zm.909-.193 6.618-10.907a.146.146 0 0 1 .237-.018c.582.692 2.753 3.64.067 6.327-2.45 2.452-5.572 4.2-6.73 4.804-.13.068-.269-.08-.192-.206M12.641.028c-.132-.093-.295.065-.206.2 1.478 2.252 6.392 9.745 7.07 10.87.67 1.109 1.987 2.952 2.097 4.53.011.157.228.19.283.041.088-.239.182-.524.27-.85 1.105-4.11-.5-8.472-3.985-10.915z" fill="#0080BC"/></g>
<text x="1450" y="394" text-anchor="start" class="smallLabel"><tspan x="1450" dy="0">ENS</tspan></text>
<text x="1450" y="412" text-anchor="start" class="tiny"><tspan x="1450" dy="0">Identity and provenance</tspan></text>
<text x="1414" y="436" text-anchor="start" class="tiny"><tspan x="1414" dy="0">Names every seat and the agent;</tspan><tspan x="1414" dy="18">citations resolve live.</tspan></text>
<rect class="chainBox" x="1396" y="498" width="368" height="118"/>
<rect x="1414" y="514" width="26" height="26" rx="6.8" fill="#111"/><text x="1427.0" y="532.2" text-anchor="middle" class="logoText" style="font-size:12.0px">0G</text>
<text x="1450" y="528" text-anchor="start" class="smallLabel"><tspan x="1450" dy="0">0G</tspan></text>
<text x="1450" y="546" text-anchor="start" class="tiny"><tspan x="1450" dy="0">Inference and archive</tspan></text>
<text x="1414" y="570" text-anchor="start" class="tiny"><tspan x="1414" dy="0">Runs the model in an enclave and</tspan><tspan x="1414" dy="18">keeps the session archive.</tspan></text>
<rect class="chainBox" x="1396" y="632" width="368" height="118"/>
<g transform="translate(1414,648) scale(0.010400)"><path d="M1250,0C559.64,0,0,559.64,0,1250S559.64,2500,1250,2500s1250-559.64,1250-1250S1940.36,0,1250,0" fill="#222"/><path d="M1758.12,1790.62H1599.38V1453.13H900.62v337.49H741.87V696.25H900.62v329.37h698.76V696.25h158.75Zm-850-463.75h698.75V1152.5H908.12Z" fill="#fff"/></g>
<text x="1450" y="662" text-anchor="start" class="smallLabel"><tspan x="1450" dy="0">Hedera</tspan></text>
<text x="1450" y="680" text-anchor="start" class="tiny"><tspan x="1450" dy="0">Provenance and payouts</tspan></text>
<text x="1414" y="704" text-anchor="start" class="tiny"><tspan x="1414" dy="0">Timestamps the log, and settles</tspan><tspan x="1414" dy="18">the money that follows it.</tspan></text>
<path class="flow" d="M432,264 L494,264" marker-end="url(#arrow)"/>
<path class="flow" d="M494,312 L432,312" marker-end="url(#arrow)"/>
<path class="flow" d="M888,289.0 L906,289.0" marker-end="url(#arrow)"/>
<path class="flow" d="M691.0,350 L691.0,360" marker-end="url(#arrow)"/>
<path class="flow" d="M888,423.0 L906,423.0" marker-end="url(#arrow)"/>
<path class="flow" d="M691.0,484 L691.0,494" marker-end="url(#arrow)"/>
<path class="flow" d="M1105.0,484 L1105.0,494" marker-end="url(#arrow)"/>
<path class="flow" d="M888,592 L906,666" marker-end="url(#arrow)"/>
<path class="flow" d="M1105.0,618 L1105.0,628" marker-end="url(#arrow)"/>
<path class="flow" d="M492,423.0 L482,423.0 L482,691.0 L490,691.0" marker-end="url(#arrow)"/>
<path class="flowGreen" d="M1302,270 L1394,274" marker-end="url(#arrowGreen)"/>
<path class="flowGreen" d="M1302,318 L1394,408" marker-end="url(#arrowGreen)"/>
<path class="flowGreen" d="M1302,438 L1394,538" marker-end="url(#arrowGreen)"/>
<path class="flowGreen" d="M1302,578 L1394,574" marker-end="url(#arrowGreen)"/>
<path class="flowGreen" d="M1302,706 L1394,684" marker-end="url(#arrowGreen)"/>
<path class="flowGreen" d="M691.0,752 L691.0,772 L1350,772 L1350,700 L1392,700" marker-end="url(#arrowGreen)"/>
<text x="50" y="862" text-anchor="start" class="body"><tspan x="50" dy="0">The archive keeps everything. The brain keeps only what the crew accepted — that gap is the product, not a limitation.</tspan></text>
</svg>