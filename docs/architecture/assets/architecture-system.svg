<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1140" viewBox="0 0 1840 1140" role="img" aria-labelledby="title desc">
<title id="title">MASS system architecture</title>
<desc id="desc">How a MASS session runs: verified humans in a browser, one Durable Object per session holding the event log, inference and archive on 0G, provenance and payroll on Hedera, personhood from World, and identity from ENS.</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
    <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
  </marker>
  <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
    <path d="M2,2 L10,6 L2,10 Z" fill="#b45309"/>
  </marker>
  <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
    <path d="M2,2 L10,6 L2,10 Z" fill="#15803d"/>
  </marker>
  <filter id="softShadow" x="-12%" y="-12%" width="126%" height="132%">
    <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.10"/>
  </filter>
  <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#eef6ff"/><stop offset="1" stop-color="#f8fbff"/>
  </linearGradient>
  <linearGradient id="chainGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f6fdf9"/><stop offset="1" stop-color="#fbfefc"/>
  </linearGradient>
  <linearGradient id="clientGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fdf9f4"/><stop offset="1" stop-color="#fffdfa"/>
  </linearGradient>
</defs>
<style>
  .bg { fill: #f8fafc; }
  .title { font: 800 44px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
  .subtitle { font: 550 19px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
  .sectionName { font: 800 21px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; letter-spacing: .04em; }
  .smallLabel { font: 750 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
  .body { font: 500 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
  .tiny { font: 600 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
  .mono { font: 500 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #475569; }
  .flowTag { font: 750 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
  .logoText { font: 800 20px Inter, ui-sans-serif, system-ui, sans-serif; fill: #fff; }
  .group { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; rx: 20; }
  .groupCore { fill: url(#coreGrad); stroke: #93c5fd; stroke-width: 2; rx: 22; }
  .groupChain { fill: url(#chainGrad); stroke: #86efac; stroke-width: 2; rx: 22; }
  .groupClient { fill: url(#clientGrad); stroke: #fcd9a8; stroke-width: 2; rx: 22; }
  .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 12; filter: url(#softShadow); }
  .plain { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 12; }
  .blueBox { fill: #dbeafe; stroke: #60a5fa; stroke-width: 1.4; rx: 12; }
  .amberBox { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1.4; rx: 12; }
  .chainBox { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 14; filter: url(#softShadow); }
  .tagBox { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; }
  .dashed { fill: #ffffff; fill-opacity: .55; stroke: #cbd5e1; stroke-width: 1.2; stroke-dasharray: 6 5; rx: 14; }
  .flow { fill: none; stroke: #475569; stroke-width: 2.2; }
  .flowAmber { fill: none; stroke: #b45309; stroke-width: 2.2; }
  .flowGreen { fill: none; stroke: #15803d; stroke-width: 2.2; }
</style>
<rect class="bg" x="0" y="0" width="1840" height="1140"/>
<text x="56" y="66" text-anchor="start" class="title"><tspan x="56" dy="0">MASS — System Architecture</tspan></text>
<text x="58" y="104" text-anchor="start" class="subtitle"><tspan x="58" dy="0">Verified humans build one agent together. Every contribution is signed, anchored, and owned — and the payroll follows the same log.</tspan></text>
<rect class="group" x="50" y="150" width="300" height="400"/>
<text x="76" y="184" text-anchor="start" class="sectionName"><tspan x="76" dy="0">CREW</tspan></text>
<rect class="amberBox" x="80" y="196" width="240" height="106"/>
<text x="200.0" y="226" text-anchor="middle" class="smallLabel"><tspan x="200.0" dy="0">Verified human</tspan></text>
<text x="100" y="250" text-anchor="start" class="body"><tspan x="100" dy="0">One seat per person.</tspan><tspan x="100" dy="20">Signer · Builder · Observer</tspan></text>
<rect class="plain" x="80" y="322" width="240" height="92"/>
<text x="200.0" y="352" text-anchor="middle" class="smallLabel"><tspan x="200.0" dy="0">Wallet holder</tspan></text>
<text x="100" y="376" text-anchor="start" class="body"><tspan x="100" dy="0">ENS name as login.</tspan><tspan x="100" dy="18">May co-sign; not</tspan><tspan x="100" dy="18">sybil-checked.</tspan></text>
<rect class="plain" x="80" y="434" width="240" height="92"/>
<text x="200.0" y="464" text-anchor="middle" class="smallLabel"><tspan x="200.0" dy="0">Client / employer</tspan></text>
<text x="100" y="488" text-anchor="start" class="body"><tspan x="100" dy="0">Hires the agent,</tspan><tspan x="100" dy="20">pays per job.</tspan></text>
<rect class="groupClient" x="400" y="150" width="400" height="626"/>
<text x="426" y="184" text-anchor="start" class="sectionName"><tspan x="426" dy="0">BROWSER  ·  React + assistant-ui</tspan></text>
<rect class="blueBox" x="430" y="190" width="340" height="116"/>
<text x="600.0" y="220" text-anchor="middle" class="smallLabel"><tspan x="600.0" dy="0">Session thread</tspan></text>
<text x="450" y="244" text-anchor="start" class="body"><tspan x="450" dy="0">Streaming chat. Token deltas</tspan><tspan x="450" dy="20">never touch the event log.</tspan></text>
<rect class="blueBox" x="430" y="322" width="340" height="116"/>
<text x="600.0" y="352" text-anchor="middle" class="smallLabel"><tspan x="600.0" dy="0">Crew rail</tspan></text>
<text x="450" y="376" text-anchor="start" class="body"><tspan x="450" dy="0">Live seats, tiers, event feed,</tspan><tspan x="450" dy="20">HCS ticker with HashScan links.</tspan></text>
<rect class="blueBox" x="430" y="454" width="340" height="116"/>
<text x="600.0" y="484" text-anchor="middle" class="smallLabel"><tspan x="600.0" dy="0">Review sheet</tspan></text>
<text x="450" y="508" text-anchor="start" class="body"><tspan x="450" dy="0">Mid- and end-session harvest.</tspan><tspan x="450" dy="20">Two signers merge a contribution.</tspan></text>
<rect class="dashed" x="424" y="588" width="352" height="164"/>
<text x="440" y="612" text-anchor="start" class="tiny"><tspan x="440" dy="0">STANDALONE PAGES  ·  no session, no seat</tspan></text>
<rect class="plain" x="438" y="624" width="324" height="56"/>
<text x="600.0" y="654" text-anchor="middle" class="smallLabel"><tspan x="600.0" dy="0">Agent CV  /cv/&lt;name&gt;</tspan></text>
<rect class="plain" x="438" y="690" width="324" height="56"/>
<text x="600.0" y="720" text-anchor="middle" class="smallLabel"><tspan x="600.0" dy="0">Subname console  /ens-admin</tspan></text>
<rect class="groupCore" x="850" y="150" width="470" height="620"/>
<text x="876" y="184" text-anchor="start" class="sectionName"><tspan x="876" dy="0">CLOUDFLARE  ·  edge</tspan></text>
<rect class="plain" x="880" y="196" width="410" height="86"/>
<text x="1085.0" y="226" text-anchor="middle" class="smallLabel"><tspan x="1085.0" dy="0">Worker</tspan></text>
<text x="900" y="250" text-anchor="start" class="body"><tspan x="900" dy="0">Routes /api and /ws · serves the SPA</tspan></text>
<rect class="box" x="880" y="306" width="410" height="330"/>
<text x="1085" y="338" text-anchor="middle" class="smallLabel"><tspan x="1085" dy="0">Durable Object — SessionRoom</tspan></text>
<text x="1085" y="360" text-anchor="middle" class="tiny"><tspan x="1085" dy="0">One per session. The single writer.</tspan></text>
<rect class="plain" x="902" y="380" width="176" height="118"/>
<text x="990.0" y="410" text-anchor="middle" class="smallLabel"><tspan x="990.0" dy="0">Event log</tspan></text>
<text x="918" y="434" text-anchor="start" class="tiny"><tspan x="918" dy="0">Append-only.</tspan><tspan x="918" dy="19">Hashed before it</tspan><tspan x="918" dy="19">takes a sequence</tspan><tspan x="918" dy="19">number.</tspan></text>
<rect class="plain" x="1094" y="380" width="176" height="118"/>
<text x="1182.0" y="410" text-anchor="middle" class="smallLabel"><tspan x="1182.0" dy="0">Replay</tspan></text>
<text x="1110" y="434" text-anchor="start" class="tiny"><tspan x="1110" dy="0">Deterministic fold.</tspan><tspan x="1110" dy="19">No clock, no</tspan><tspan x="1110" dy="19">randomness,</tspan><tspan x="1110" dy="19">no I/O.</tspan></text>
<rect class="plain" x="902" y="512" width="176" height="108"/>
<text x="990.0" y="542" text-anchor="middle" class="smallLabel"><tspan x="990.0" dy="0">Authority</tspan></text>
<text x="918" y="566" text-anchor="start" class="tiny"><tspan x="918" dy="0">Tier decides who</tspan><tspan x="918" dy="19">may run canonical,</tspan><tspan x="918" dy="19">and who may sign.</tspan></text>
<rect class="plain" x="1094" y="512" width="176" height="108"/>
<text x="1182.0" y="542" text-anchor="middle" class="smallLabel"><tspan x="1182.0" dy="0">Attribution</tspan></text>
<text x="1110" y="566" text-anchor="start" class="tiny"><tspan x="1110" dy="0">Which chunks an</tspan><tspan x="1110" dy="19">answer used — the</tspan><tspan x="1110" dy="19">payroll input.</tspan></text>
<rect class="amberBox" x="880" y="662" width="410" height="88"/>
<text x="1085.0" y="692" text-anchor="middle" class="smallLabel"><tspan x="1085.0" dy="0">Node sidecar  ·  Railway</tspan></text>
<text x="900" y="716" text-anchor="start" class="body"><tspan x="900" dy="0">0G Storage and the Hedera SDK need gRPC and</tspan><tspan x="900" dy="20">Node internals a Worker cannot give them.</tspan></text>
<rect class="groupChain" x="1370" y="150" width="420" height="940"/>
<text x="1396" y="184" text-anchor="start" class="sectionName"><tspan x="1396" dy="0">WEB3  ·  what the app cannot fake alone</tspan></text>
<rect class="chainBox" x="1396" y="196" width="368" height="196"/>
<circle cx="1438.0" cy="236.0" r="22.0" fill="#111"/><circle cx="1438.0" cy="236.0" r="13.2" fill="none" stroke="#fff" stroke-width="3.74"/><ellipse cx="1438.0" cy="236.0" rx="5.720000000000001" ry="13.2" fill="none" stroke="#fff" stroke-width="3.74"/>
<text x="1474" y="234" text-anchor="start" class="smallLabel"><tspan x="1474" dy="0">World</tspan></text>
<text x="1474" y="254" text-anchor="start" class="tiny"><tspan x="1474" dy="0">Proof of personhood  ·  seat.claimed</tspan></text>
<text x="1416" y="288" text-anchor="start" class="body"><tspan x="1416" dy="0">Selfie Check proof, verified</tspan><tspan x="1416" dy="20">server-side. One human, one seat.</tspan><tspan x="1416" dy="20">Sybil score sets the tier — a</tspan><tspan x="1416" dy="20">wallet signature never can.</tspan></text>
<rect class="chainBox" x="1396" y="414" width="368" height="196"/>
<g transform="translate(1416,432) scale(1.83333)"><path d="M11.725.223 5.107 11.13a.146.146 0 0 1-.237.018c-.583-.692-2.753-3.64-.067-6.327 2.45-2.452 5.572-4.2 6.73-4.804.13-.068.269.08.192.206m-.366 23.747c.132.093.295-.064.206-.2-1.478-2.251-6.392-9.744-7.07-10.869-.67-1.11-1.987-2.953-2.097-4.53-.011-.158-.228-.19-.283-.042a10 10 0 0 0-.27.85c-1.105 4.11.5 8.472 3.985 10.916zm.909-.193 6.618-10.907a.146.146 0 0 1 .237-.018c.582.692 2.753 3.64.067 6.327-2.45 2.452-5.572 4.2-6.73 4.804-.13.068-.269-.08-.192-.206M12.641.028c-.132-.093-.295.065-.206.2 1.478 2.252 6.392 9.745 7.07 10.87.67 1.109 1.987 2.952 2.097 4.53.011.157.228.19.283.041.088-.239.182-.524.27-.85 1.105-4.11-.5-8.472-3.985-10.915z" fill="#0080BC"/></g>
<text x="1474" y="452" text-anchor="start" class="smallLabel"><tspan x="1474" dy="0">ENS</tspan></text>
<text x="1474" y="472" text-anchor="start" class="tiny"><tspan x="1474" dy="0">Identity and provenance  ·  live resolve</tspan></text>
<text x="1416" y="506" text-anchor="start" class="body"><tspan x="1416" dy="0">Every seat and the agent get a</tspan><tspan x="1416" dy="20">subname. Citations resolve live;</tspan><tspan x="1416" dy="20">a name that fails to resolve is</tspan><tspan x="1416" dy="20">shown as unverified, not hidden.</tspan></text>
<rect class="chainBox" x="1396" y="632" width="368" height="196"/>
<rect x="1416" y="650" width="44" height="44" rx="11.4" fill="#111"/><text x="1438.0" y="680.8" text-anchor="middle" class="logoText" style="font-size:20.2px">0G</text>
<text x="1474" y="670" text-anchor="start" class="smallLabel"><tspan x="1474" dy="0">0G</tspan></text>
<text x="1474" y="690" text-anchor="start" class="tiny"><tspan x="1474" dy="0">Inference and archive  ·  TEE run</tspan></text>
<text x="1416" y="724" text-anchor="start" class="body"><tspan x="1416" dy="0">Router runs every answer in a TEE</tspan><tspan x="1416" dy="20">trust mode. Storage holds the full</tspan><tspan x="1416" dy="20">session archive — the brain keeps</tspan><tspan x="1416" dy="20">only what the crew accepted.</tspan></text>
<rect class="chainBox" x="1396" y="850" width="368" height="214"/>
<g transform="translate(1416,868) scale(0.017600)"><path d="M1250,0C559.64,0,0,559.64,0,1250S559.64,2500,1250,2500s1250-559.64,1250-1250S1940.36,0,1250,0" fill="#222"/><path d="M1758.12,1790.62H1599.38V1453.13H900.62v337.49H741.87V696.25H900.62v329.37h698.76V696.25h158.75Zm-850-463.75h698.75V1152.5H908.12Z" fill="#fff"/></g>
<text x="1474" y="888" text-anchor="start" class="smallLabel"><tspan x="1474" dy="0">Hedera</tspan></text>
<text x="1474" y="908" text-anchor="start" class="tiny"><tspan x="1474" dy="0">Provenance and payroll  ·  anchor + payout</tspan></text>
<text x="1416" y="942" text-anchor="start" class="body"><tspan x="1416" dy="0">HCS anchors a hash of each event —</tspan><tspan x="1416" dy="20">hashes only, never content. HTS</tspan><tspan x="1416" dy="20">and HBAR transfers settle a job:</tspan><tspan x="1416" dy="20">70% follows use, 30% ownership.</tspan><tspan x="1416" dy="20">Mirror Node feeds the live ticker.</tspan></text>
<rect class="group" x="50" y="830" width="1290" height="238"/>
<text x="76" y="864" text-anchor="start" class="sectionName"><tspan x="76" dy="0">THE LOOP  ·  what a contribution goes through</tspan></text>
<rect class="plain" x="86" y="878" width="190" height="118"/>
<text x="181.0" y="908" text-anchor="middle" class="smallLabel"><tspan x="181.0" dy="0">Talk</tspan></text>
<text x="104" y="932" text-anchor="start" class="tiny"><tspan x="104" dy="0">Anyone chats.</tspan><tspan x="104" dy="19">Nothing is</tspan><tspan x="104" dy="19">taught yet.</tspan></text>
<path class="flow" d="M278,937 L288,937" marker-end="url(#arrow)"/>
<rect class="plain" x="292" y="878" width="190" height="118"/>
<text x="387.0" y="908" text-anchor="middle" class="smallLabel"><tspan x="387.0" dy="0">Harvest</tspan></text>
<text x="310" y="932" text-anchor="start" class="tiny"><tspan x="310" dy="0">Extraction filters</tspan><tspan x="310" dy="19">for durable</tspan><tspan x="310" dy="19">knowledge only.</tspan></text>
<path class="flow" d="M484,937 L494,937" marker-end="url(#arrow)"/>
<rect class="plain" x="498" y="878" width="190" height="118"/>
<text x="593.0" y="908" text-anchor="middle" class="smallLabel"><tspan x="593.0" dy="0">Sign</tspan></text>
<text x="516" y="932" text-anchor="start" class="tiny"><tspan x="516" dy="0">Two verified</tspan><tspan x="516" dy="19">humans merge</tspan><tspan x="516" dy="19">the contribution.</tspan></text>
<path class="flow" d="M690,937 L700,937" marker-end="url(#arrow)"/>
<rect class="plain" x="704" y="878" width="190" height="118"/>
<text x="799.0" y="908" text-anchor="middle" class="smallLabel"><tspan x="799.0" dy="0">Brain</tspan></text>
<text x="722" y="932" text-anchor="start" class="tiny"><tspan x="722" dy="0">Chunk enters the</tspan><tspan x="722" dy="19">brain and the</tspan><tspan x="722" dy="19">cap table.</tspan></text>
<path class="flow" d="M896,937 L906,937" marker-end="url(#arrow)"/>
<rect class="plain" x="910" y="878" width="190" height="118"/>
<text x="1005.0" y="908" text-anchor="middle" class="smallLabel"><tspan x="1005.0" dy="0">Cite</tspan></text>
<text x="928" y="932" text-anchor="start" class="tiny"><tspan x="928" dy="0">Answers cite the</tspan><tspan x="928" dy="19">chunk and the</tspan><tspan x="928" dy="19">human behind it.</tspan></text>
<path class="flow" d="M1102,937 L1112,937" marker-end="url(#arrow)"/>
<rect class="plain" x="1116" y="878" width="190" height="118"/>
<text x="1211.0" y="908" text-anchor="middle" class="smallLabel"><tspan x="1211.0" dy="0">Pay</tspan></text>
<text x="1134" y="932" text-anchor="start" class="tiny"><tspan x="1134" dy="0">Job settles along</tspan><tspan x="1134" dy="19">use + ownership.</tspan></text>
<text x="86" y="1034" text-anchor="start" class="body"><tspan x="86" dy="0">The archive keeps everything. The brain keeps only what was accepted — that gap is the product, not a limitation.</tspan></text>
<path class="flow" d="M320,243 L428,243" marker-end="url(#arrow)"/>
<path class="flow" d="M772,248 L878,239" marker-end="url(#arrow)"/>
<rect class="tagBox" x="786" y="196" width="198" height="26" rx="13"/>
<text x="885.1" y="214" text-anchor="middle" class="flowTag"><tspan x="885.1" dy="0">1 · WebSocket intents</tspan></text>
<path class="flow" d="M1085,284 L1085,304" marker-end="url(#arrow)"/>
<path class="flow" d="M878,420 L774,382" marker-end="url(#arrow)"/>
<rect class="tagBox" x="786" y="330" width="157" height="26" rx="13"/>
<text x="864.6" y="348" text-anchor="middle" class="flowTag"><tspan x="864.6" dy="0">2 · token deltas</tspan></text>
<path class="flowGreen" d="M1394,262 L1292,240" marker-end="url(#arrowGreen)"/>
<path class="flowGreen" d="M1394,486 L1292,452" marker-end="url(#arrowGreen)"/>
<path class="flowGreen" d="M1394,700 L1294,618" marker-end="url(#arrowGreen)"/>
<path class="flowAmber" d="M1290,706 L1394,730" marker-end="url(#arrowAmber)"/>
<path class="flowAmber" d="M1290,716 L1394,900" marker-end="url(#arrowAmber)"/>
</svg>