<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1160" viewBox="0 0 1840 1160" role="img" aria-labelledby="title desc">
<title id="title">MASS architecture — simplified</title>
<desc id="desc">A simplified view of MASS: a human authenticates with World and ENS, works in a browser client, and the AI Sessions Engine runs inference on 0G, anchors logs to Hedera, and settles payouts by contribution and use.</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
    <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
  </marker>
  <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
    <path d="M2,2 L10,6 L2,10 Z" fill="#b45309"/>
  </marker>
  <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
    <path d="M2,2 L10,6 L2,10 Z" fill="#15803d"/>
  </marker>
  <filter id="softShadow" x="-12%" y="-12%" width="126%" height="132%">
    <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.10"/>
  </filter>
  <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#eef6ff"/><stop offset="1" stop-color="#f8fbff"/>
  </linearGradient>
  <linearGradient id="chainGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f6fdf9"/><stop offset="1" stop-color="#fbfefc"/>
  </linearGradient>
  <linearGradient id="clientGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fdf9f4"/><stop offset="1" stop-color="#fffdfa"/>
  </linearGradient>
</defs>
<style>
  .bg { fill: #f8fafc; }
  .title { font: 800 44px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
  .subtitle { font: 550 19px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
  .sectionName { font: 800 21px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; letter-spacing: .04em; }
  .sectionSub { font: 600 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; letter-spacing: .02em; }
  .smallLabel { font: 750 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
  .body { font: 500 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
  .tiny { font: 600 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
  .flowTag { font: 750 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
  .logoText { font: 800 20px Inter, ui-sans-serif, system-ui, sans-serif; fill: #fff; }
  .group { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; rx: 20; }
  .groupCore { fill: url(#coreGrad); stroke: #93c5fd; stroke-width: 2; rx: 22; }
  .groupChain { fill: url(#chainGrad); stroke: #86efac; stroke-width: 2; rx: 22; }
  .groupClient { fill: url(#clientGrad); stroke: #fcd9a8; stroke-width: 2; rx: 22; }
  .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 12; filter: url(#softShadow); }
  .plain { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 12; }
  .blueBox { fill: #dbeafe; stroke: #60a5fa; stroke-width: 1.4; rx: 12; }
  .amberBox { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1.4; rx: 12; }
  .chainBox { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 14; filter: url(#softShadow); }
  .tagBox { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; }
  .dashed { fill: #ffffff; fill-opacity: .55; stroke: #cbd5e1; stroke-width: 1.2; stroke-dasharray: 6 5; rx: 14; }
  .flow { fill: none; stroke: #475569; stroke-width: 2.2; }
  .flowAmber { fill: none; stroke: #b45309; stroke-width: 2.2; }
  .flowGreen { fill: none; stroke: #15803d; stroke-width: 2.2; }
</style>
<rect class="bg" x="0" y="0" width="1840" height="1160"/>
<text x="56" y="66" text-anchor="start" class="title"><tspan x="56" dy="0">MASS — How It Works</tspan></text>
<text x="58" y="104" text-anchor="start" class="subtitle"><tspan x="58" dy="0">Verified humans build one agent together. Every contribution is signed, anchored, and owned — and the payout follows the same log.</tspan></text>
<rect class="amberBox" x="50" y="230" width="210" height="132"/>
<text x="155.0" y="260" text-anchor="middle" class="smallLabel"><tspan x="155.0" dy="0">Human</tspan></text>
<text x="68" y="284" text-anchor="start" class="body"><tspan x="68" dy="0">Signs in with World</tspan><tspan x="68" dy="19">or an ENS name.</tspan><tspan x="68" dy="19">One person, one seat.</tspan></text>
<rect class="groupClient" x="300" y="150" width="380" height="620"/>
<text x="326" y="184" text-anchor="start" class="sectionName"><tspan x="326" dy="0">BROWSER CLIENT</tspan></text>
<text x="326" y="206" text-anchor="start" class="sectionSub"><tspan x="326" dy="0">React</tspan></text>
<rect class="blueBox" x="328" y="230" width="324" height="116"/>
<text x="490.0" y="260" text-anchor="middle" class="smallLabel"><tspan x="490.0" dy="0">Session thread</tspan></text>
<text x="348" y="284" text-anchor="start" class="body"><tspan x="348" dy="0">Everyone talks to the same</tspan><tspan x="348" dy="20">agent, in one conversation.</tspan></text>
<rect class="blueBox" x="328" y="364" width="324" height="116"/>
<text x="490.0" y="394" text-anchor="middle" class="smallLabel"><tspan x="490.0" dy="0">Crew rail</tspan></text>
<text x="348" y="418" text-anchor="start" class="body"><tspan x="348" dy="0">Who is here, what tier they</tspan><tspan x="348" dy="20">hold, what just happened.</tspan></text>
<rect class="blueBox" x="328" y="498" width="324" height="116"/>
<text x="490.0" y="528" text-anchor="middle" class="smallLabel"><tspan x="490.0" dy="0">Review sheet</tspan></text>
<text x="348" y="552" text-anchor="start" class="body"><tspan x="348" dy="0">Where a contribution is</tspan><tspan x="348" dy="20">proposed and co-signed.</tspan></text>
<rect class="blueBox" x="328" y="632" width="324" height="116"/>
<text x="490.0" y="662" text-anchor="middle" class="smallLabel"><tspan x="490.0" dy="0">Live evidence</tspan></text>
<text x="348" y="686" text-anchor="start" class="body"><tspan x="348" dy="0">Ledger ticker, agent CV, cap</tspan><tspan x="348" dy="20">table — refreshing on their own.</tspan></text>
<rect class="groupCore" x="710" y="150" width="630" height="612"/>
<text x="736" y="184" text-anchor="start" class="sectionName"><tspan x="736" dy="0">AI SESSIONS ENGINE</tspan></text>
<text x="736" y="206" text-anchor="start" class="sectionSub"><tspan x="736" dy="0">Cloudflare Workers + Durable Objects</tspan></text>
<rect class="plain" x="734" y="230" width="286" height="124"/>
<text x="752" y="265" text-anchor="start" class="smallLabel"><tspan x="752" dy="0">CF Worker</tspan></text>
<text x="752" y="298" text-anchor="start" class="tiny"><tspan x="752" dy="0">Routes the API and the live socket,</tspan><tspan x="752" dy="18">serves the client, and hands each</tspan><tspan x="752" dy="18">session to its own single writer.</tspan></text>
<rect class="plain" x="1040" y="230" width="286" height="124"/>
<circle cx="1071.0" cy="259.0" r="13.0" fill="#111"/><circle cx="1071.0" cy="259.0" r="7.8" fill="none" stroke="#fff" stroke-width="2.21"/><ellipse cx="1071.0" cy="259.0" rx="3.38" ry="7.8" fill="none" stroke="#fff" stroke-width="2.21"/>
<g transform="translate(1092,246) scale(1.08333)"><path d="M11.725.223 5.107 11.13a.146.146 0 0 1-.237.018c-.583-.692-2.753-3.64-.067-6.327 2.45-2.452 5.572-4.2 6.73-4.804.13-.068.269.08.192.206m-.366 23.747c.132.093.295-.064.206-.2-1.478-2.251-6.392-9.744-7.07-10.869-.67-1.11-1.987-2.953-2.097-4.53-.011-.158-.228-.19-.283-.042a10 10 0 0 0-.27.85c-1.105 4.11.5 8.472 3.985 10.916zm.909-.193 6.618-10.907a.146.146 0 0 1 .237-.018c.582.692 2.753 3.64.067 6.327-2.45 2.452-5.572 4.2-6.73 4.804-.13.068-.269-.08-.192-.206M12.641.028c-.132-.093-.295.065-.206.2 1.478 2.252 6.392 9.745 7.07 10.87.67 1.109 1.987 2.952 2.097 4.53.011.157.228.19.283.041.088-.239.182-.524.27-.85 1.105-4.11-.5-8.472-3.985-10.915z" fill="#0080BC"/></g>
<text x="1126" y="265" text-anchor="start" class="smallLabel"><tspan x="1126" dy="0">Auth</tspan></text>
<text x="1058" y="298" text-anchor="start" class="tiny"><tspan x="1058" dy="0">World proves a unique human.</tspan><tspan x="1058" dy="18">ENS gives every seat a name</tspan><tspan x="1058" dy="18">that resolves outside our app.</tspan></text>
<rect class="plain" x="734" y="370" width="286" height="124"/>
<text x="752" y="405" text-anchor="start" class="smallLabel"><tspan x="752" dy="0">Session Room</tspan></text>
<text x="752" y="438" text-anchor="start" class="tiny"><tspan x="752" dy="0">One per session. An append-only</tspan><tspan x="752" dy="18">event log; every view of the</tspan><tspan x="752" dy="18">session is a fold over it.</tspan></text>
<rect class="plain" x="1040" y="370" width="286" height="124"/>
<g transform="translate(1058,386) scale(0.010400)"><path d="M1250,0C559.64,0,0,559.64,0,1250S559.64,2500,1250,2500s1250-559.64,1250-1250S1940.36,0,1250,0" fill="#222"/><path d="M1758.12,1790.62H1599.38V1453.13H900.62v337.49H741.87V696.25H900.62v329.37h698.76V696.25h158.75Zm-850-463.75h698.75V1152.5H908.12Z" fill="#fff"/></g>
<text x="1092" y="405" text-anchor="start" class="smallLabel"><tspan x="1092" dy="0">Ledger</tspan></text>
<text x="1058" y="438" text-anchor="start" class="tiny"><tspan x="1058" dy="0">A hash of each event is anchored</tspan><tspan x="1058" dy="18">to the public ledger — hashes</tspan><tspan x="1058" dy="18">only, never the content.</tspan></text>
<rect class="plain" x="734" y="510" width="286" height="124"/>
<rect x="752" y="526" width="26" height="26" rx="6.8" fill="#111"/><text x="765.0" y="544.2" text-anchor="middle" class="logoText" style="font-size:12.0px">0G</text>
<text x="786" y="545" text-anchor="start" class="smallLabel"><tspan x="786" dy="0">LLM harness</tspan></text>
<text x="752" y="578" text-anchor="start" class="tiny"><tspan x="752" dy="0">Runs every answer on the 0G</tspan><tspan x="752" dy="18">Router in a trusted enclave,</tspan><tspan x="752" dy="18">framed by what the crew taught.</tspan></text>
<rect class="plain" x="1040" y="510" width="286" height="124"/>
<rect x="1058" y="526" width="26" height="26" rx="6.8" fill="#111"/><text x="1071.0" y="544.2" text-anchor="middle" class="logoText" style="font-size:12.0px">0G</text>
<text x="1092" y="545" text-anchor="start" class="smallLabel"><tspan x="1092" dy="0">Attribution + storage</tspan></text>
<text x="1058" y="578" text-anchor="start" class="tiny"><tspan x="1058" dy="0">Measures which knowledge an</tspan><tspan x="1058" dy="18">answer used, and archives the</tspan><tspan x="1058" dy="18">whole session to 0G Storage.</tspan></text>
<rect class="plain" x="734" y="650" width="286" height="92"/>
<g transform="translate(752,666) scale(0.010400)"><path d="M1250,0C559.64,0,0,559.64,0,1250S559.64,2500,1250,2500s1250-559.64,1250-1250S1940.36,0,1250,0" fill="#222"/><path d="M1758.12,1790.62H1599.38V1453.13H900.62v337.49H741.87V696.25H900.62v329.37h698.76V696.25h158.75Zm-850-463.75h698.75V1152.5H908.12Z" fill="#fff"/></g>
<text x="786" y="685" text-anchor="start" class="smallLabel"><tspan x="786" dy="0">Payout engine</tspan></text>
<text x="752" y="718" text-anchor="start" class="tiny"><tspan x="752" dy="0">Splits a job by use and ownership.</tspan></text>
<rect class="amberBox" x="1040" y="650" width="286" height="92"/>
<text x="1058" y="685" text-anchor="start" class="smallLabel"><tspan x="1058" dy="0">Node sidecar</tspan></text>
<text x="1058" y="718" text-anchor="start" class="tiny"><tspan x="1058" dy="0">The parts that cannot run on the edge.</tspan></text>
<rect class="groupChain" x="1370" y="150" width="420" height="930"/>
<text x="1396" y="184" text-anchor="start" class="sectionName"><tspan x="1396" dy="0">ONCHAIN</tspan></text>
<text x="1396" y="206" text-anchor="start" class="sectionSub"><tspan x="1396" dy="0">what the app cannot vouch for alone</tspan></text>
<rect class="chainBox" x="1396" y="226" width="368" height="190"/>
<circle cx="1438.0" cy="266.0" r="22.0" fill="#111"/><circle cx="1438.0" cy="266.0" r="13.2" fill="none" stroke="#fff" stroke-width="3.74"/><ellipse cx="1438.0" cy="266.0" rx="5.720000000000001" ry="13.2" fill="none" stroke="#fff" stroke-width="3.74"/>
<text x="1474" y="264" text-anchor="start" class="smallLabel"><tspan x="1474" dy="0">World</tspan></text>
<text x="1474" y="284" text-anchor="start" class="tiny"><tspan x="1474" dy="0">Proof of personhood</tspan></text>
<text x="1416" y="318" text-anchor="start" class="body"><tspan x="1416" dy="0">Verifies that a seat is a real,</tspan><tspan x="1416" dy="20">unique person — the thing a</tspan><tspan x="1416" dy="20">wallet signature can never show.</tspan></text>
<rect class="chainBox" x="1396" y="434" width="368" height="190"/>
<g transform="translate(1416,452) scale(1.83333)"><path d="M11.725.223 5.107 11.13a.146.146 0 0 1-.237.018c-.583-.692-2.753-3.64-.067-6.327 2.45-2.452 5.572-4.2 6.73-4.804.13-.068.269.08.192.206m-.366 23.747c.132.093.295-.064.206-.2-1.478-2.251-6.392-9.744-7.07-10.869-.67-1.11-1.987-2.953-2.097-4.53-.011-.158-.228-.19-.283-.042a10 10 0 0 0-.27.85c-1.105 4.11.5 8.472 3.985 10.916zm.909-.193 6.618-10.907a.146.146 0 0 1 .237-.018c.582.692 2.753 3.64.067 6.327-2.45 2.452-5.572 4.2-6.73 4.804-.13.068-.269-.08-.192-.206M12.641.028c-.132-.093-.295.065-.206.2 1.478 2.252 6.392 9.745 7.07 10.87.67 1.109 1.987 2.952 2.097 4.53.011.157.228.19.283.041.088-.239.182-.524.27-.85 1.105-4.11-.5-8.472-3.985-10.915z" fill="#0080BC"/></g>
<text x="1474" y="472" text-anchor="start" class="smallLabel"><tspan x="1474" dy="0">ENS</tspan></text>
<text x="1474" y="492" text-anchor="start" class="tiny"><tspan x="1474" dy="0">Identity and provenance</tspan></text>
<text x="1416" y="526" text-anchor="start" class="body"><tspan x="1416" dy="0">Names every seat and the agent.</tspan><tspan x="1416" dy="20">Citations resolve live, so a claim</tspan><tspan x="1416" dy="20">can be checked outside MASS.</tspan></text>
<rect class="chainBox" x="1396" y="642" width="368" height="190"/>
<rect x="1416" y="660" width="44" height="44" rx="11.4" fill="#111"/><text x="1438.0" y="690.8" text-anchor="middle" class="logoText" style="font-size:20.2px">0G</text>
<text x="1474" y="680" text-anchor="start" class="smallLabel"><tspan x="1474" dy="0">0G</tspan></text>
<text x="1474" y="700" text-anchor="start" class="tiny"><tspan x="1474" dy="0">Inference and archive</tspan></text>
<text x="1416" y="734" text-anchor="start" class="body"><tspan x="1416" dy="0">Runs the model in a trusted</tspan><tspan x="1416" dy="20">enclave and keeps the full</tspan><tspan x="1416" dy="20">session archive.</tspan></text>
<rect class="chainBox" x="1396" y="850" width="368" height="208"/>
<g transform="translate(1416,868) scale(0.017600)"><path d="M1250,0C559.64,0,0,559.64,0,1250S559.64,2500,1250,2500s1250-559.64,1250-1250S1940.36,0,1250,0" fill="#222"/><path d="M1758.12,1790.62H1599.38V1453.13H900.62v337.49H741.87V696.25H900.62v329.37h698.76V696.25h158.75Zm-850-463.75h698.75V1152.5H908.12Z" fill="#fff"/></g>
<text x="1474" y="888" text-anchor="start" class="smallLabel"><tspan x="1474" dy="0">Hedera</tspan></text>
<text x="1474" y="908" text-anchor="start" class="tiny"><tspan x="1474" dy="0">Provenance and payouts</tspan></text>
<text x="1416" y="942" text-anchor="start" class="body"><tspan x="1416" dy="0">Timestamps the log so the order</tspan><tspan x="1416" dy="20">of contributions is not ours to</tspan><tspan x="1416" dy="20">edit, and settles the money that</tspan><tspan x="1416" dy="20">follows it.</tspan></text>
<path class="flow" d="M262,296 L326,296" marker-end="url(#arrow)"/>
<path class="flow" d="M654,282 L732,276" marker-end="url(#arrow)"/>
<path class="flow" d="M732,430 L656,418" marker-end="url(#arrow)"/>
<path class="flowGreen" d="M1394,320 L1342,300" marker-end="url(#arrowGreen)"/>
<path class="flowGreen" d="M1394,528 L1342,440" marker-end="url(#arrowGreen)"/>
<path class="flowGreen" d="M1394,736 L1342,578" marker-end="url(#arrowGreen)"/>
<path class="flowGreen" d="M1394,944 L1342,700" marker-end="url(#arrowGreen)"/>
<rect class="group" x="50" y="820" width="1290" height="254"/>
<text x="76" y="854" text-anchor="start" class="sectionName"><tspan x="76" dy="0">THE LOOP</tspan></text>
<text x="76" y="876" text-anchor="start" class="sectionSub"><tspan x="76" dy="0">what a contribution goes through</tspan></text>
<rect class="plain" x="86" y="890" width="196" height="128"/>
<text x="184.0" y="920" text-anchor="middle" class="smallLabel"><tspan x="184.0" dy="0">Talk</tspan></text>
<text x="104" y="944" text-anchor="start" class="tiny"><tspan x="104" dy="0">Authenticated users</tspan><tspan x="104" dy="19">collaborate in one</tspan><tspan x="104" dy="19">AI session.</tspan></text>
<path class="flow" d="M283,954 L291,954" marker-end="url(#arrow)"/>
<rect class="plain" x="294" y="890" width="196" height="128"/>
<text x="392.0" y="920" text-anchor="middle" class="smallLabel"><tspan x="392.0" dy="0">Harvest</tspan></text>
<text x="312" y="944" text-anchor="start" class="tiny"><tspan x="312" dy="0">Valuable inputs are</tspan><tspan x="312" dy="19">picked out and credited</tspan><tspan x="312" dy="19">to whoever gave them.</tspan></text>
<path class="flow" d="M491,954 L499,954" marker-end="url(#arrow)"/>
<rect class="plain" x="502" y="890" width="196" height="128"/>
<text x="600.0" y="920" text-anchor="middle" class="smallLabel"><tspan x="600.0" dy="0">Sign</tspan></text>
<text x="520" y="944" text-anchor="start" class="tiny"><tspan x="520" dy="0">Signers reach consensus</tspan><tspan x="520" dy="19">and approve the</tspan><tspan x="520" dy="19">contribution.</tspan></text>
<path class="flow" d="M699,954 L707,954" marker-end="url(#arrow)"/>
<rect class="plain" x="710" y="890" width="196" height="128"/>
<text x="808.0" y="920" text-anchor="middle" class="smallLabel"><tspan x="808.0" dy="0">Brain</tspan></text>
<text x="728" y="944" text-anchor="start" class="tiny"><tspan x="728" dy="0">The knowledge enters</tspan><tspan x="728" dy="19">the brain and the</tspan><tspan x="728" dy="19">cap table together.</tspan></text>
<path class="flow" d="M907,954 L915,954" marker-end="url(#arrow)"/>
<rect class="plain" x="918" y="890" width="196" height="128"/>
<text x="1016.0" y="920" text-anchor="middle" class="smallLabel"><tspan x="1016.0" dy="0">Cite</tspan></text>
<text x="936" y="944" text-anchor="start" class="tiny"><tspan x="936" dy="0">Answers cite the</tspan><tspan x="936" dy="19">knowledge and the</tspan><tspan x="936" dy="19">human behind it.</tspan></text>
<path class="flow" d="M1115,954 L1123,954" marker-end="url(#arrow)"/>
<rect class="plain" x="1126" y="890" width="196" height="128"/>
<text x="1224.0" y="920" text-anchor="middle" class="smallLabel"><tspan x="1224.0" dy="0">Payouts</tspan></text>
<text x="1144" y="944" text-anchor="start" class="tiny"><tspan x="1144" dy="0">Premium split by</tspan><tspan x="1144" dy="19">contribution and by</tspan><tspan x="1144" dy="19">what the job used.</tspan></text>
<text x="86" y="1048" text-anchor="start" class="body"><tspan x="86" dy="0">The archive keeps everything. The brain keeps only what the crew accepted — that gap is the product, not a limitation.</tspan></text>
</svg>