name: Publish & deploy zg-storage

# Every push to main rebuilds the sidecar image and redeploys Railway.
#
# An earlier version tried to skip the redeploy when the image was unchanged,
# but build-push-action stamps the commit SHA into the image labels, so the
# digest differs on every commit even when the sidecar code is identical. The
# check could never fire, so it was removed rather than left looking like a
# safeguard. Cost of always deploying: roughly 20s of sidecar downtime per push.
#
# Railway deploys from a public ghcr image rather than from GitHub source,
# because its GitHub App is not linked to the Railway account and a
# project-scoped RAILWAY_API_TOKEN cannot create a repo trigger.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: zg-storage-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The default docker driver cannot export a cache; buildx can.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ./services/zg-storage
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mass-zg-storage:latest
            ghcr.io/${{ github.repository_owner }}/mass-zg-storage:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Railway
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          # Pin by digest, not tag. A tag can move between the build and the
          # pull; a digest is the exact bytes this run produced.
          IMAGE="ghcr.io/${{ github.repository_owner }}/mass-zg-storage@${DIGEST}"

          gql() {
            curl -sS --fail-with-body --max-time 60 https://backboard.railway.com/graphql/v2 \
              -H "Authorization: Bearer $RAILWAY_API_TOKEN" \
              -H 'content-type: application/json' -d "$1"
          }

          echo "deploying $IMAGE"

          gql "$(jq -nc --arg s "$SERVICE_ID" --arg e "$ENVIRONMENT_ID" --arg i "$IMAGE" '{
            query: "mutation($s:String!,$e:String!,$i:String!){ serviceInstanceUpdate(serviceId:$s, environmentId:$e, input:{ source:{ image:$i } }) }",
            variables: { s: $s, e: $e, i: $i }
          }')" | tee /tmp/update.json
          grep -q '"serviceInstanceUpdate":true' /tmp/update.json

          gql "$(jq -nc --arg s "$SERVICE_ID" --arg e "$ENVIRONMENT_ID" '{
            query: "mutation($s:String!,$e:String!){ serviceInstanceDeployV2(serviceId:$s, environmentId:$e) }",
            variables: { s: $s, e: $e }
          }')" | tee /tmp/deploy.json
          DEPLOY_ID=$(jq -r '.data.serviceInstanceDeployV2' /tmp/deploy.json)
          echo "deployment: $DEPLOY_ID"

          # Fail loudly: a green tick over a broken deploy is worse than none.
          for _ in $(seq 1 40); do
            STATUS=$(gql "$(jq -nc --arg d "$DEPLOY_ID" '{
              query: "query($d:String!){ deployment(id:$d){ status } }", variables: { d: $d }
            }')" | jq -r '.data.deployment.status')
            echo "status: $STATUS"
            case "$STATUS" in
              SUCCESS) echo "DEPLOYED=1" >> "$GITHUB_ENV"; exit 0 ;;
              FAILED|CRASHED) echo "::error::Railway deploy $STATUS"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::timed out waiting for Railway deploy"
          exit 1

      - name: Verify sidecar health
        if: env.DEPLOYED == '1'
        run: |
          set -euo pipefail
          for _ in $(seq 1 12); do
            if curl -sS --max-time 20 https://zg-storage-production.up.railway.app/health | grep -q '"ok":true'; then
              echo "sidecar healthy"; exit 0
            fi
            sleep 10
          done
          echo "::error::sidecar did not become healthy"
          exit 1
