name: Publish zg-storage image

# Builds the 0G Storage sidecar and pushes it to ghcr.io, so Railway can deploy
# it as a public image without needing its GitHub App linked to the account.

on:
  push:
    branches: [main]
    paths:
      - "services/zg-storage/**"
      - ".github/workflows/zg-storage-image.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./services/zg-storage
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mass-zg-storage:latest
            ghcr.io/${{ github.repository_owner }}/mass-zg-storage:${{ github.sha }}
