name: CI

# Typecheck, tests, build and the zero-hex check on every push and PR.
#
# main is a shared, fast-moving branch: without this, a type error or a failing
# test can land and only be discovered by the next person to pull.
#
# Every commit on main is then deployed to Cloudflare by the `deploy` job below.
# The Railway sidecar has its own workflow and deploys in parallel, so a push to
# main updates both halves of the system.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # On main this group also covers the deploy, so cancelling an in-flight run is
  # the right thing: the newer commit is what should end up live.
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The 0G storage SDK pins ethers 6.13.1 while the root project uses
      # 6.17.x, so npm's peer resolution needs the same flag the team uses
      # locally. Without it the install fails on ERESOLVE.
      - name: Install (worker)
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Install (web)
        run: npm --prefix web ci || npm --prefix web install

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Zero-hex check (ENS doctrine)
        run: node scripts/grep-hex.mjs

      # Also proves the Worker bundles — a broken import surfaces here rather
      # than at deploy time.
      - name: Build web
        run: npm run web:build

  # Ships main to Cloudflare. Gated on `verify` on purpose: "immediately" should
  # not mean "before we know it compiles" — the whole point of the checks above
  # is that they run before anyone sees the result. It costs ~40s.
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mass.aonishchenko33.workers.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (worker)
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Install (web)
        run: npm --prefix web ci || npm --prefix web install

      # `npm run deploy` runs the web build first via predeploy, so the assets
      # uploaded are always built from this commit.
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy

      # A deploy that returns 500 is not a deploy. Fail loudly rather than leave
      # a green tick over a broken site.
      - name: Verify it answers
        run: |
          set -euo pipefail
          for _ in $(seq 1 12); do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' https://mass.aonishchenko33.workers.dev/ || true)
            if [ "$CODE" = "200" ]; then
              curl -sS --fail https://mass.aonishchenko33.workers.dev/api/stats > /dev/null
              echo "worker is live"; exit 0
            fi
            echo "got $CODE, retrying"; sleep 5
          done
          echo "::error::worker did not answer after deploy"
          exit 1
